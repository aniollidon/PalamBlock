<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pestanya nova</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235f6368' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><line x1='12' y1='5' x2='12' y2='19'></line><line x1='5' y1='12' x2='19' y2='12'></line></svg>">

    <style>
        :root {
            --bg-color: #91BBD3;
            --text-main: #202124;
            --text-secondary: #0c2034;
            --search-bg: #ffffff;
            --search-border: #dfe1e5;
            --search-shadow: 0 1px 6px rgba(32,33,36,0.15);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            background-image: url('wallpaper.jpg');
            background-size: cover;
            background-position: center;
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
            color: var(--text-main);
            overflow: hidden;
        }

        /* Rellotge */
        #clock {
            font-size: 6.5rem;
            font-weight: 200;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            letter-spacing: -2px;
        }

        /* Cercador Google */
        .search-container {
            width: 90%;
            max-width: 580px;
            margin-bottom: 4rem;
        }

        .search-form {
            display: flex;
            background: var(--search-bg);
            border: 1px solid var(--search-border);
            border-radius: 24px;
            padding: 2px 20px;
            transition: all 0.3s cubic-bezier(.25,.8,.25,1);
        }

        .search-form:hover, .search-form:focus-within {
            box-shadow: var(--search-shadow);
            border-color: rgba(223,225,229,0);
        }

        .search-input {
            flex: 1;
            height: 44px;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
        }

        /* Branding: Logo + Text */
        .branding {
            position: absolute;
            bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }

        .branding:hover {
            opacity: 1;
        }

        .logo-img {
            height: 28px; /* Mida discreta */
            width: auto;
        }

        .brand-text {
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        /* Contenidor de llista blanca */
        #whitelist-container {
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            max-width: 680px;
            width: 90%;
            margin-bottom: 2rem;
        }

        .whitelist-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-main);
            width: 72px;
            padding: 10px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: background 0.25s ease, transform 0.2s ease, border-color 0.25s ease;
        }

        .whitelist-item:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.18);
            transform: translateY(-3px);
        }

        .whitelist-icon {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            object-fit: contain;
            margin-bottom: 5px;
        }

        .whitelist-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }

        .whitelist-fallback svg {
            width: 16px;
            height: 16px;
        }

        .whitelist-label {
            font-size: 0.7rem;
            text-align: center;
            word-break: break-word;
            line-height: 1.2;
            max-width: 76px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        /* Animacions */
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <div id="clock" class="fade-in"></div>

    <div class="search-container fade-in">
        <form action="https://www.google.com/search" method="GET" class="search-form">
            <input type="text" name="q" class="search-input" placeholder="Cerca a Google..." autocomplete="off" autofocus>
        </form>
    </div>

    <div id="whitelist-container" class="fade-in"></div>

    <div class="branding fade-in">
        <img src="image.png" alt="PalamBlock" class="logo-img">
        <span class="brand-text">PalamBlock</span>
    </div>

    <script src="default-icons.js"></script>
    <script src="newtab.js"></script>

</body>
</html>
